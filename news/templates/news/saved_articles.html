{% extends 'base.html' %}{% block content %}<h1>Saved articles</h1><div class="grid">{% for item in saved %}<article class="card"><span class="tag">{{ item.article.get_category_display }}</span><h2><a href="{{ item.article.get_absolute_url }}">{{ item.article.title }}</a></h2><p>{{ item.article.summary }}</p></article>{% empty %}<p>You have not saved any articles yet.</p>{% endfor %}</div>{% endblock %}
