{% extends 'base.html' %}{% block content %}<section class="hero"><h1>Live technology news</h1><p>Current stories retrieved from the Hacker News Algolia API.</p></section><form class="filters" method="get"><input name="q" value="{{ query }}" placeholder="Topic"><button>Fetch stories</button></form><div class="grid">{% for story in stories %}<article class="card"><span class="tag">External</span><h2><a href="{{ story.url }}" rel="noopener">{{ story.title }}</a></h2><small>By {{ story.author }}</small></article>{% empty %}<div class="empty"><h2>News service unavailable</h2><p>Please try again later.</p></div>{% endfor %}</div>{% endblock %}
